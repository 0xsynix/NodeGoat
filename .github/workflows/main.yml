name: CI

on: [push]

jobs:
  sast_scan:
    name: Semgrep Full Scan
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep

    steps:
      #step 1 
      - name: Checkout code
        uses: actions/checkout@v2.8.0
      
      #step 2
      - name: Full scan
        run: semgrep scan --sarif --output report.sarif --metrics=off --config="p/default" .

      #step 3 
      - name: Save report as artifcat
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with: 
          name: report.sarif
          path: report.sarif
          if-no-files-found: warn
            
  image_scan:
    name: Build Image and Run Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2.8.0

      - name: Set up Docker
        uses: docker/setup-docker-action@v5.7.0

      - name: Build Docker Image
        run: docker build -f Dockerfile -t nodegoat:latest .

      - name: Install Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nodegoat:latest
          format: json
          output: trivy-findings.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: '0'

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trivy-findings
          path: trivy-findings.json
          if-no-files-found: warn
